<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Revisión adaptable NI</title><style>body{font:16px system-ui;background:#0B1220;color:#f2f6fc;margin:16px}select,button{font:inherit;min-height:44px}iframe{display:block;border:1px solid #53647d;background:white}main{overflow:auto}pre{white-space:pre-wrap}label{display:inline-block;margin:8px}</style><h1>Revisión adaptable NI</h1><p>Vista de prueba del sitio real en un marco. No simula Safari, Firefox, Edge ni un dispositivo físico. La ampliación CSS no equivale al zoom nativo del navegador.</p><label>Tamaño <select id="size"><option>320 × 740</option><option>360 × 800</option><option>390 × 844</option><option>740 × 320</option><option>768 × 1024</option><option>1024 × 768</option><option>1440 × 900</option></select></label><label>Ampliación CSS <select id="zoom"><option value="1">100 %</option><option value="2">200 % (CSS, no zoom nativo)</option></select></label><button id="reload">Recargar dashboard</button><button id="measure">Medir contenido</button><pre id="report" aria-live="polite">Cargando</pre><main><iframe id="preview" title="Dashboard en revisión" src="./?revision=responsive-zafiro-2" width="320" height="740"></iframe></main><script>
const frame=document.querySelector('iframe'),size=document.querySelector('#size'),zoom=document.querySelector('#zoom'),report=document.querySelector('#report');
function apply(){const [w,h]=size.value.split(' × ').map(Number);frame.width=w;frame.height=h;if(frame.contentDocument?.body)frame.contentDocument.body.style.zoom=zoom.value;}
function measure(){const d=frame.contentDocument,root=d.documentElement;const targets=[...d.querySelectorAll('button,select,input:not([type=checkbox]):not([type=radio])')].filter(e=>e.getClientRects().length&&!e.disabled);report.textContent=JSON.stringify({viewport:root.clientWidth,scrollWidth:root.scrollWidth,desbordamiento:root.scrollWidth>root.clientWidth,controlesPequenos:targets.filter(e=>{const b=e.getBoundingClientRect();return b.width<43.9||b.height<43.9}).map(e=>({texto:e.textContent?.slice(0,60)||e.getAttribute('aria-label'),width:e.getBoundingClientRect().width,height:e.getBoundingClientRect().height})),ampliacionCSS:zoom.value},null,2);}
document.querySelector('#reload').onclick=()=>{frame.src='./?revision='+Date.now();};size.onchange=()=>{apply();};zoom.onchange=()=>{apply();};frame.onload=()=>{apply();};document.querySelector('#measure').onclick=measure;
</script></html>
